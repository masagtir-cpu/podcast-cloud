[project]
name = "podcast-cloud"
version = "0.1.0"
description = "Cloud-only podcast pipeline (RSS -> Gemini -> TTS)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
# Google Cloud TTS はサービスアカウントが必要なため既定では入れない。
# 使う場合: uv sync --extra gcloud
gcloud = ["google-cloud-texttospeech>=2.16"]

[tool.uv]
package = false
