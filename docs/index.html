<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポッドキャスト</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7; margin: 0 auto; padding: 1.75rem 1.1rem 4rem; max-width: 38rem;
  }
  h1 { font-size: 1.35rem; margin: 0 0 .2rem; }
  .lead { margin: 0 0 2rem; opacity: .7; font-size: .9rem; }

  .ep {
    padding: 1.1rem 0;
    border-top: 1px solid rgba(128,128,128,.28);
  }
  .ep h2 { font-size: 1.02rem; margin: 0 0 .15rem; }
  .meta { font-size: .8rem; opacity: .6; margin: 0 0 .5rem; }
  .summary { font-size: .88rem; margin: 0 0 .7rem; opacity: .85; }
  audio { width: 100%; height: 2.4rem; }
  .dl { font-size: .78rem; opacity: .6; display: inline-block; margin-top: .4rem; }

  .subscribe {
    margin-top: 2.5rem; padding: 1rem;
    border: 1px solid rgba(128,128,128,.35); border-radius: .6rem;
  }
  .subscribe h2 { font-size: .95rem; margin: 0 0 .3rem; }
  .subscribe p { font-size: .82rem; opacity: .7; margin: 0 0 .7rem; }
  .row { display: flex; gap: .5rem; align-items: center; }
  .row code { flex: 1; word-break: break-all; font-size: .78rem; }
  button {
    flex-shrink: 0; padding: .45rem .8rem; font-size: .8rem; cursor: pointer;
    border: 1px solid rgba(128,128,128,.5); border-radius: .4rem;
    background: transparent; color: inherit;
  }
  button:hover { background: rgba(128,128,128,.15); }
  .empty { opacity: .6; font-size: .9rem; padding: 1.5rem 0; }
</style>
</head>
<body>
  <h1 id="title">ポッドキャスト</h1>
  <p class="lead">新しい回は自動で追加されます。下の再生ボタンを押すとそのまま聴けます。</p>

  <div id="list"><p class="empty">読み込み中...</p></div>

  <div class="subscribe">
    <h2>スマホのアプリで自動受信する</h2>
    <p>下のURLをポッドキャストアプリに登録すると、新しい回が自動で届きます(任意)。</p>
    <div class="row">
      <code id="feed">—</code>
      <button id="copy">コピー</button>
    </div>
  </div>

<script>
const feedUrl = location.origin + location.pathname.replace(/\/[^/]*$/, "/") + "feed.xml";
document.getElementById("feed").textContent = feedUrl;
document.getElementById("copy").addEventListener("click", async (e) => {
  try {
    await navigator.clipboard.writeText(feedUrl);
    e.target.textContent = "コピーしました";
    setTimeout(() => (e.target.textContent = "コピー"), 1800);
  } catch { e.target.textContent = "長押しで選択"; }
});

const fmtTime = (s) => {
  const m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m}分`;
};
const fmtDate = (d) => {
  const [y, m, day] = d.split("-");
  return `${y}年${Number(m)}月${Number(day)}日`;
};
const esc = (s) => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };

fetch("episodes.json", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((eps) => {
    const list = document.getElementById("list");
    if (!eps.length) throw new Error();
    document.getElementById("title").textContent = eps[0].title.replace(/\s*\d{4}年.*$/, "");
    list.innerHTML = eps.map((e) => `
      <div class="ep">
        <h2>${esc(e.title)}</h2>
        <p class="meta">${fmtDate(e.date)} ・ ${fmtTime(e.seconds)}</p>
        <p class="summary">${esc(e.summary)}</p>
        <audio controls preload="none" src="${esc(e.url)}"></audio>
        <a class="dl" href="${esc(e.url)}" download>ダウンロード</a>
      </div>`).join("");
  })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<p class="empty">まだ配信がありません。GitHub の Actions タブから一度実行すると、ここに表示されます。</p>';
  });
</script>
</body>
</html>
